# A workspace version on public main that has no tag yet is released: tests, packages, the published
# release with its tag, then the installer run against it. A version whose tag exists does nothing.
name: release
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  version:
    if: github.repository == 'mattirk/sill'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.tag.outputs.release }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: python3 packaging/check-release.py
      - id: tag
        env:
          VERSION: ${{ steps.check.outputs.version }}
        run: |
          found=$(git ls-remote --tags origin "refs/tags/v$VERSION")
          if [ -n "$found" ]; then
            echo "v$VERSION is already released; nothing to do."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
  linux:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Build dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends bubblewrap pkg-config libwayland-dev libxkbcommon-dev
      - name: Let bubblewrap make user namespaces
        run: |
          # Ubuntu 24.04 denies unprivileged user namespaces through AppArmor; every jailed test needs them
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          bwrap --ro-bind / / true
      - run: cargo test --locked --workspace -- --test-threads=1
      - run: cargo build --locked --release
      - run: packaging/release.sh --no-build
      - run: packaging/deb.sh --no-build
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.tar.gz
            dist/*.deb
          if-no-files-found: error
  mac-image:
    needs: version
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      SILL_IMAGE_CACHE: ${{ github.workspace }}/target/image-cache
      SILL_IMAGE_BINARIES: ${{ github.workspace }}/target/mac-prebuilt
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.100.0
      - name: Image tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y --no-install-recommends qemu-system-arm qemu-efi-aarch64 cloud-image-utils libdigest-sha-perl
      - name: Compile guest software natively in Debian ARM64
        run: packaging/mac/prebuild-linux.sh
      - name: Provision Linux image with QEMU
        run: packaging/mac-image.sh
      - name: Compress image for the Mac runner
        run: |
          gzip -6 -c dist/mac-image/system.raw > dist/mac-image/system.raw.gz
          stat -c %s dist/mac-image/system.raw > dist/mac-image/system.raw.gz.size
          cp dist/mac-image/commit dist/mac-image/system.raw.gz.commit
          cd dist/mac-image
          sha256sum system.raw.gz system.raw.gz.size system.raw.gz.commit commit > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: mac-system-image
          compression-level: 0
          retention-days: 3
          path: |
            dist/mac-image/system.raw.gz*
            dist/mac-image/commit
            dist/mac-image/SHA256SUMS
          if-no-files-found: error
      - name: Image build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mac-image-logs
          path: |
            target/mac-image/console.log
            target/mac-image/serial.log
            target/mac-image/vm.log
          retention-days: 7
  mac:
    needs: [version, mac-image]
    runs-on: macos-15
    timeout-minutes: 90
    env:
      # Free ad-hoc signing; local app.sh builds still prefer the existing local certificate.
      SILL_SIGNING_IDENTITY: '-'
      SILL_IMAGE_EXPECT_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.100.0
      - uses: actions/download-artifact@v4
        with:
          name: mac-system-image
          path: dist/mac-image
      - name: Verify image transfer
        run: cd dist/mac-image && shasum -a 256 -c SHA256SUMS
      - run: cargo test --locked -p sill-gui -p sill-vm -p sill-client -p sill-proto -- --test-threads=1
      - run: packaging/mac/app.sh
      - name: Name release package
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: mv dist/Sill.dmg "dist/sill-$VERSION-macos-arm64.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: release-mac
          path: dist/*.dmg
          if-no-files-found: error
  publish:
    needs: [version, linux, mac]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: python3 packaging/check-release.py --notes > "$RUNNER_TEMP/notes.md"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: dist
      - name: Checksum every release package
        run: |
          cd dist
          sha256sum *.tar.gz *.deb *.dmg > SHA256SUMS
          sha256sum -c SHA256SUMS
      - name: Publish the release and its tag
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        # gh uploads the packages to a draft and publishes it only when all of them are there;
        # the notes are the version's CHANGELOG.md section, with GitHub's compare link after them
        run: |
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "sill $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --generate-notes --latest \
            dist/*.tar.gz dist/*.deb dist/*.dmg dist/SHA256SUMS
  # What the download page tells people to paste, run against the release that was just published.
  install:
    needs: [version, publish]
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install from the published release
        env:
          SILL_VERSION: ${{ needs.version.outputs.version }}
        run: python3 packaging/try-install.py
