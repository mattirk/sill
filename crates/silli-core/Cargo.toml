[package]
name = "silli-core"
description = "silli: policies, jail builder, ledger, session store (library)"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
toml.workspace = true
glob.workspace = true
rustix.workspace = true
tracing.workspace = true
agent-client-protocol = { version = "3", features = ["process", "stdio", "unstable_protocol_v2", "unstable_subagents"] }
serde_json.workspace = true
futures = "0.3"
async-channel = "2"
async-io = "2"
sha2 = "0.11.1"
# the test desktop's pictures: a Wayland client of its own compositor, PNG for the live view
wayland-client = { version = "0.31", features = ["dlopen"] }  # the daemon alone (headless.sh, cargo install) must not link libwayland
wayland-scanner = "0.31"
png = "0.18"
rusqlite.workspace = true
silli-memory.workspace = true
silli-proto.workspace = true
rand = "0.10.3"
libc = "0.2"
similar = "3.2.1"

[lints]
workspace = true
