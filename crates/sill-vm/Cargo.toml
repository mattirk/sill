[package]
name = "sill-vm"
description = "sill: the local Linux VM a desktop without the daemon runs its box in (macOS: Apple's Virtualization framework)"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
# the app's image ships compressed (system.raw.gz) and is unpacked sparsely (`setup`)
flate2 = "1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-virtualization = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
