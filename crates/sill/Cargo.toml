[package]
name = "sill"
description = "sill: the `sill` command and the daemon (the desktop window is the sill-gui crate)"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "sill"
path = "src/main.rs"

[dependencies]
sill-core.workspace = true
sill-memory.workspace = true
sill-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
rustix.workspace = true
# sill-mac: the vsock socket to Sill.app on the Mac (daemon/host_mac.rs)
libc = "0.2"
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
rusqlite.workspace = true
# the daemon's Host control display viewing (pure Rust, headless too)
x11rb = "0.14"
async-channel = "2"
futures = "0.3"
