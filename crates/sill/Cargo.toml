[package]
name = "sill-shelf"
description = "sill: agent shelf — the `sill` command and the GTK shelf (the crate is sill-shelf, SPEC §8 #7)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "sill"
path = "src/main.rs"

[dependencies]
sill-core.workspace = true
sill-memory.workspace = true
sill-proto.workspace = true
anyhow.workspace = true
clap.workspace = true
rustix.workspace = true
toml.workspace = true
serde.workspace = true
serde_json.workspace = true
gtk4 = { version = "0.11", features = ["v4_18"] }
gdk4-x11 = { version = "0.11", features = ["v4_18"] }
x11rb = { version = "0.14", features = ["randr"] }
pulldown-cmark = { version = "0.13", default-features = false }
async-channel = "2"
futures = "0.3"
sourceview5 = "0.11"
vte4 = { version = "0.10", features = ["v0_70"] }
shell-words = "1"
yeslogic-fontconfig-sys = "6"
