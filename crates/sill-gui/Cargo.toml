[package]
name = "sill-gui"
description = "Experimental Iced frontend for the Sill public protocol"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The GPU renderer by default (the person's decision, 2026-11-04: the software renderer scrolled at
# five times GTK's CPU). iced falls back to software where no GPU can be used;
# `--no-default-features` builds the software renderer only.
default = ["gpu"]
gpu = ["iced/wgpu"]

[dependencies]
sill-client.workspace = true
sill-proto.workspace = true
anyhow.workspace = true
serde_json.workspace = true
clap.workspace = true
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "x11", "wayland", "markdown", "highlighter", "advanced", "tokio", "svg", "canvas", "web-colors"] }
iced_selection = { version = "=0.5.0", features = ["markdown"] }
async-channel = "2"
alacritty_terminal = { version = "0.25.1", default-features = false }
# effect tasks for the keyboard's own widget operations, as iced's focus_next is built (iced does
# not re-export its runtime); tests also run tasks to their end with it
iced_runtime = "=0.14.0"
unicode-segmentation = "1"

[dev-dependencies]
serde.workspace = true
iced_test = "=0.14.0"

