[package]
name = "sill-gui"
description = "sill: the desktop window (iced), a client of the daemon's public protocol"
version.workspace = true
edition.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
# The GPU renderer by default (the person's decision, 2026-11-04: the software renderer scrolled at
# five times the CPU of the GTK shelf it replaced). iced falls back to software where no GPU can be used;
# `--no-default-features` builds the software renderer only.
default = ["gpu"]
gpu = ["iced/wgpu"]

[dependencies]
sill-client.workspace = true
sill-proto.workspace = true
anyhow.workspace = true
serde_json.workspace = true
serde.workspace = true
toml.workspace = true
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
arboard = { version = "3", features = ["wayland-data-control"] }
percent-encoding = "2"
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "tokio"] }
clap.workspace = true
iced = { version = "=0.14.0", default-features = false, features = ["tiny-skia", "x11", "wayland", "markdown", "highlighter", "advanced", "tokio", "svg", "image-without-codecs", "canvas", "web-colors"] }
iced_selection = { version = "=0.5.0", features = ["markdown"] }
async-channel = "2"
alacritty_terminal = { version = "0.25.1", default-features = false }
# effect tasks for the keyboard's own widget operations, as iced's focus_next is built (iced does
# not re-export its runtime); tests also run tasks to their end with it
iced_runtime = "=0.14.0"
unicode-segmentation = "1"
unicode-width = "0.2"
# the desktop on X11: the global hotkey, placing the window on the screen edge, asking the window
# manager to activate it (the daemon's x11rb, same version)
x11rb = { version = "0.14", features = ["randr"] }
rustix.workspace = true
# the local day of a time (localtime_r), for the running-time chart
libc = "0.2"
resvg = { version = "0.45", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# the Mac's window edge (`macos.rs`)
objc2 = "0.6"
# its own Linux VM, the box its daemon runs in (`local_vm.rs`)
sill-vm = { path = "../sill-vm" }
# the menu bar's icon (`tray/menu_bar.rs`)
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(not(target_os = "macos"))'.dependencies]
# the panel's tray icon (`tray/sni.rs`)
ksni = { version = "0.3.7", default-features = false, features = ["tokio", "blocking"] }

[dev-dependencies]
iced_test = "=0.14.0"

