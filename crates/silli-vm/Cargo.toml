[package]
name = "silli-vm"
description = "silli: the local Linux VM a desktop without the daemon runs its box in (macOS: Apple's Virtualization framework; Windows: the Host Compute System)"
version.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# the documents the Host Compute System takes and gives (`hcs.rs`)
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
# the app's image ships compressed (system.raw.gz) and is unpacked sparsely (`setup`)
flate2 = "1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-virtualization = "0.3"
block2 = "0.6"
dispatch2 = "0.3"

[lints]
workspace = true
