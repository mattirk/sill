# The Mac app's VM: what programs write reaches the disks within about 3 s instead of 30, so a VM
# stopped without a shutdown loses little (2026-11-12).
vm.dirty_expire_centisecs = 300
vm.dirty_writeback_centisecs = 100

# A process may trace only its own descendants: nothing running as the VM's user outside a jail
# attaches to the daemon or another session's processes, or takes their descriptors
# (pidfd_getfd). Kernel addresses stay out of /proc for unprivileged readers (2026-11-13).
kernel.yama.ptrace_scope = 1
kernel.kptr_restrict = 1
