# The Mac app's VM: Sill reaches sshd over the host-guest socket (vsock), never the network, so
# the TCP listener answers on the loopback only; no X11 forwarding (2026-11-13).
ListenAddress 127.0.0.1
ListenAddress ::1
X11Forwarding no
# root is let in only with a key bound to one command: Sill.app's, for the folder mounter
# (sill-mac-folders, which also sets the clock); the VM's account has no sudo (docs/sill-mac.md, finding 15)
PermitRootLogin forced-commands-only
