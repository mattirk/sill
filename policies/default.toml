# silli policy "default" (SPEC §4.2): the whole machine visible, every write recorded in the session's
# overlay, secrets hidden, network only to the agent's own endpoints. Copy to ~/.config/silli/policies/
# under another name to make variants.

name = "default"
description = "Whole machine overlaid, secrets masked, network allow-list"

[network]
mode = "allow"            # none | all | allow
# Tooling only. The model provider's own hosts are not here: each agent brings them as its registry
# `domains` (api.anthropic.com for Claude Code, api.openai.com for Codex, ...), merged in at launch, so
# a Codex session cannot reach Anthropic and vice versa. Anything else the agent tries is refused and
# shown with an Allow button; a click records a grant for that session only.
allow = [
  "registry.npmjs.org", "*.npmjs.org",                                  # ACP adapters via npx
  "github.com", "*.github.com", "*.githubusercontent.com",
  "crates.io", "static.crates.io", "index.crates.io",
  "pypi.org", "files.pythonhosted.org",
  "deb.debian.org", "*.debian.org",
]
allow_local = []          # host-local addresses are refused in every mode unless listed here
# A pattern grants one port: 443 for CONNECT (TLS) and 80 for plain HTTP; "host:8443" names another,
# "host:*" any. e.g. allow_local = ["localhost:8080", "server.lan:*"]

# Refused hosts silli never asks about: telemetry / crash reporting (Sentry, Statsig, Datadog, Segment,
# PostHog, ...; the list is in policy.rs `quiet_default`). Still blocked, just quietly. Set
# `quiet = []` to be asked about everything, or list your own hosts to replace the built-in list.

[paths]
# Unrecorded host writes — one reason each (SPEC §4.2 "direct"). Agent state is NOT here: each agent gets
# a silli-owned home bound over its real one (registry `home_paths`), so nothing it writes reaches the host's
# own copy of the agent (shell snapshots, plugin caches: SPEC §4.10 #4).
direct = [
]
# Session-private scratch: bound from the state filesystem, kept across turns, gone with the session.
# Caches hold code the host would later run (uv/pip/pre-commit), so they never touch the host.
private = ["~/.cache", "~/.npm"]
# Hidden in the jail and in the host view:
mask = [
  "~/.ssh", "~/.gnupg", "~/secrets",
  "~/.local/share/keyrings", "~/.password-store",
  # Wildcard masks hide their literal parent, including credentials created after launch.
  # This hides all host ~/.config; non-secret settings there are hidden too.
  "~/.config/*/credentials*", "~/.netrc", "~/.git-credentials",
  "~/.npmrc", "~/.pypirc",
  "~/.cargo/credentials", "~/.cargo/credentials.toml",
  "~/.aws", "~/.azure", "~/.config/gcloud",
  "~/.docker", "~/.kube", "~/.vault-token",
  "~/.config/Nextcloud",           # sync account tokens
  "~/.mozilla", "~/.config/chromium", "~/.config/google-chrome",
  # silli's own folders under the name it had until 0.0.6, for a machine where they are left
  "~/.config/sill", "~/.local/state/sill", "~/.local/state/sill.bak-*",
]
# Group-shared trees (setgid dirs, group-writable files) must be direct or ro: overlayfs can't copy up
# files owned by another uid/gid inside the user namespace (SPEC §4.10 #16). Add yours here, e.g.
#   direct = [..., "/srv/shared-project"]
# Visible, never writable:
ro = []
# Host mount points left out of the jail (shown as empty directories). The last is the state
# filesystem under the name silli had until 0.0.6, where one is still mounted:
hidden_mounts = ["/boot", "/boot/efi", "/var/lib/sill"]
# Folders pinned to a session are bound live (host = jail): edits and commits made in the jail are host
# edits and commits at once; review = git for repositories. Everything else is overlaid and reviewed in
# Changes; nothing is kept without a click.
# Recorded, but not hashed per turn:
# Inside git repositories the repo's own .gitignore decides what is build output; these patterns cover
# the rest (home-level tool caches and the like), and the shells' and REPLs' histories: written by every
# terminal in a session, they stay in its overlay and never show in Changes.
ledger_ignore = ["target/", "node_modules/", "__pycache__/", ".venv/", "build/", ".cargo/registry/", ".cargo/.global-cache", ".cargo/.package-cache", ".rustup/",
    ".bash_history", ".zsh_history", ".local/share/fish/fish_history", ".python_history", ".node_repl_history", ".lesshst", ".sqlite_history", ".psql_history"]

[limits]
cpu_weight = 20
io_weight = 20
memory_high = "8G"
memory_max = "12G"
tasks_max = 512
idle_timeout_minutes = 120    # stop the whole jail after this long without a turn
agent_idle_minutes = 10       # stop just the agent process (≈1.6 % CPU parked, SPEC §4.10 #17); resume via session/load
required = true               # no cgroup to hold these limits (direct launcher, no delegated subtree): no session.
                              # false = start anyway, with a "no resource limits" warning (SPEC §4.7)

[jail]
allow_userns = false
# No raw host display or session-bus grants; see docs/permission-modes.md.
# seccomp deny-list under bwrap (mounts, keyrings, bpf, io_uring, new namespaces …): the second fence.
# Off only to find out whether it is what breaks a tool.
seccomp = true
[jail.env]
# extra environment for every process in the jail, e.g. TZ = "Europe/Helsinki"

[processes]
# Managed processes (`silli-proc start --name dev --port 3000 -- …`): ports exposed on this machine's
# loopback without asking; any other port is asked once per session. e.g. expose = ["3000-3999"]
expose = []
