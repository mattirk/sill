# sill policy "default" (SPEC §4.2): the whole machine visible, every write recorded in the session's
# overlay, secrets hidden, network only to the agent's own endpoints. Copy to ~/.config/sill/policies/
# under another name to make variants; `audit` and `open` presets live next to this file.

name = "default"
description = "Whole machine overlaid, secrets masked, network allow-list"

[network]
mode = "allow"            # none | all | allow
allow = [
  "api.anthropic.com", "*.anthropic.com", "claude.ai", "*.claude.ai",   # Claude Code
  "statsig.anthropic.com", "*.sentry.io",
  "registry.npmjs.org", "*.npmjs.org",                                  # ACP adapters via npx
  "github.com", "*.github.com", "*.githubusercontent.com",
  "crates.io", "static.crates.io", "index.crates.io",
  "pypi.org", "files.pythonhosted.org",
  "deb.debian.org", "*.debian.org",
]
allow_local = []          # host-local addresses are refused in every mode unless listed here

[paths]
# Unrecorded host writes — one reason each (SPEC §4.2 "direct"):
direct = [
  "~/.cache",                      # package/tool caches: throwing them away per session costs time, records nothing useful
  "~/.npm",                        # npm cache (npx adapters)
  # Claude Code state that carries no executable config. settings.json, hooks, plugins and ~/.claude.json
  # (MCP server commands live there) stay overlaid: kept only on review (SPEC §4.10 #4).
  "~/.claude/.credentials.json",   # login must persist
  "~/.claude/projects",            # transcripts: needed for resume
  "~/.claude/sessions", "~/.claude/backups", "~/.claude/statsig", "~/.claude/todos",
  "~/.claude/shell-snapshots", "~/.claude/debug", "~/.claude/file-history", "~/.claude/cache",
]
# Hidden in the jail and in the host view:
mask = [
  "~/.ssh", "~/.gnupg", "~/secrets",
  "~/.local/share/keyrings",
  "~/.config/*/credentials*", "~/.netrc", "~/.git-credentials",
  "~/.aws", "~/.azure", "~/.config/gcloud",
  "~/.config/Nextcloud",           # sync account tokens
  "~/.mozilla", "~/.config/chromium", "~/.config/google-chrome",
]
# Group-shared trees (setgid dirs, group-writable files) must be direct or ro: overlayfs can't copy up
# files owned by another uid/gid inside the user namespace (SPEC §4.10 #16). Add yours here, e.g.
#   direct = [..., "/srv/shared-project"]
# Visible, never writable:
ro = []
# Host mount points left out of the jail (shown as empty directories):
hidden_mounts = ["/boot", "/boot/efi"]
# Repo roots kept automatically at quiescent moments:
auto_keep = ["~/GIT/*"]
# Recorded, but neither hashed per turn nor auto-kept:
ledger_ignore = ["target/", "node_modules/", "__pycache__/", ".venv/", "build/", ".cargo/registry/"]

[limits]
cpu_weight = 20
io_weight = 20
memory_high = "8G"
memory_max = "12G"
tasks_max = 512
idle_timeout_minutes = 120    # stop the whole jail after this long without a turn
agent_idle_minutes = 10       # stop just the agent process (≈1.6 % CPU parked, SPEC §4.10 #17); resume via session/load

[jail]
allow_userns = false
[jail.env]
# extra environment for every process in the jail, e.g. TZ = "Europe/Helsinki"
