[workspace]
resolver = "3"
members = ["crates/sill-core", "crates/sill-memory", "crates/sill-proto", "crates/sill-shim", "crates/sill", "crates/sill-client", "crates/sill-gui", "crates/sill-vm"]
# patched copies of upstream crates (vendor/README.md), not members
exclude = ["vendor"]

[workspace.package]
version = "0.0.5"
edition = "2024"
repository = "https://github.com/mattirk/sill"
license = "Apache-2.0"
# the Rust that rust-toolchain.toml pins: the code is built and linted with no other
rust-version = "1.100"

# One set of lints for every crate (each has `[lints] workspace = true`). Clippy's default set,
# with warnings failing scripts/check.sh and so CI. An exception is an `#[allow(...)]` or
# `#[expect(...)]` at the site with its reason, not an entry here.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
sill-core = { path = "crates/sill-core" }
sill-memory = { path = "crates/sill-memory" }
sill-proto = { path = "crates/sill-proto" }
sill-client = { path = "crates/sill-client" }
rusqlite = { version = "0.41.0", features = ["bundled"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
rustix = { version = "1", features = ["fs", "process", "mount", "net", "pipe", "pty", "termios", "stdio", "event", "system", "time", "param"] }
glob = "0.3"
tracing = "0.1"

# Debug builds keep file and line numbers for backtraces but not full variable info: most of
# a debug artifact's size is debug info (target/ had grown to 159 GB, 2026-11-09).
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Optimized local builds with a reusable incremental cache.
[profile.local]
inherits = "release"
opt-level = 1
lto = "off"
codegen-units = 16
incremental = true

# iced_widget 0.14.2 with one accessor added (vendor/README.md)
[patch.crates-io]
iced_widget = { path = "vendor/iced_widget" }
