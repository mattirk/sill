[workspace]
resolver = "3"
members = ["crates/sill-core", "crates/sill-memory", "crates/sill-proto", "crates/sill-shim", "crates/sill", "crates/sill-client", "crates/sill-gui"]
# patched copies of upstream crates (vendor/README.md), not members
exclude = ["vendor"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/mattirk/sill-shelf"
rust-version = "1.90"

[workspace.dependencies]
sill-core = { path = "crates/sill-core" }
sill-memory = { path = "crates/sill-memory" }
sill-proto = { path = "crates/sill-proto" }
sill-client = { path = "crates/sill-client" }
rusqlite = { version = "0.41.0", features = ["bundled"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
clap = { version = "4", features = ["derive"] }
rustix = { version = "1", features = ["fs", "process", "mount", "net", "pipe", "pty", "termios", "stdio", "event", "system"] }
glob = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# Optimized local builds with a reusable incremental cache.
[profile.local]
inherits = "release"
opt-level = 1
lto = "off"
codegen-units = 16
incremental = true

# iced_widget 0.14.2 with one accessor added (vendor/README.md)
[patch.crates-io]
iced_widget = { path = "vendor/iced_widget" }
